spring.application.name=API_Gateway
server.port=9000

# Eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Keycloak / OAuth2 JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/money-minder
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/money-minder/protocol/openid-connect/certs

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.security=DEBUG
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.urls[0].name=Revenus
springdoc.swagger-ui.urls[0].url=/revenues/v3/api-docs
springdoc.swagger-ui.urls[1].name=Forum
springdoc.swagger-ui.urls[1].url=/api/posts/v3/api-docs
springdoc.swagger-ui.urls[2].name=Objectifs
springdoc.swagger-ui.urls[2].url=/api/objectifs/v3/api-docs
springdoc.swagger-ui.urls[3].name=Reclamations
springdoc.swagger-ui.urls[3].url=/api/reclamations/v3/api-docs
springdoc.swagger-ui.urls[4].name=Notifications
springdoc.swagger-ui.urls[4].url=/api/notifications/v3/api-docs
springdoc.swagger-ui.urls[5].name=Depenses
springdoc.swagger-ui.urls[5].url=/api/depenses/v3/api-docs
springdoc.swagger-ui.urls[6].name=Utilisateurs
springdoc.swagger-ui.urls[6].url=/api/utilisateurs/v3/api-docs