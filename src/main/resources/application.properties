spring.application.name=API_Gateway
server.port=9000

# Eureka
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Keycloak / OAuth2 JWT (Phase 2 : activé en mode lazy)
# IMPORTANT : on ne définit PAS issuer-uri, sinon Spring tente de fetcher
# OpenID discovery au boot et bloque si Keycloak n'est pas prêt. Avec
# uniquement jwk-set-uri, le JWKS est fetché paresseusement à la première
# requête JWT — le gateway peut démarrer indépendamment de Keycloak.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/money-minder/protocol/openid-connect/certs}

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.security=DEBUG
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.urls[0].name=Revenus
springdoc.swagger-ui.urls[0].url=/revenues/v3/api-docs
springdoc.swagger-ui.urls[1].name=Forum
springdoc.swagger-ui.urls[1].url=/api/posts/v3/api-docs
springdoc.swagger-ui.urls[2].name=Objectifs
springdoc.swagger-ui.urls[2].url=/api/objectifs/v3/api-docs
springdoc.swagger-ui.urls[3].name=Reclamations
springdoc.swagger-ui.urls[3].url=/api/reclamations/v3/api-docs
springdoc.swagger-ui.urls[4].name=Notifications
springdoc.swagger-ui.urls[4].url=/api/notifications/v3/api-docs
springdoc.swagger-ui.urls[5].name=Depenses
springdoc.swagger-ui.urls[5].url=/api/depenses/v3/api-docs
springdoc.swagger-ui.urls[6].name=Utilisateurs
springdoc.swagger-ui.urls[6].url=/api/utilisateurs/v3/api-docs